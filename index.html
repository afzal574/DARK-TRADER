<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Trader</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        nav {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-section {
            display: flex;
            align-items: center;
        }
        .nav-left {
            flex: 1;
        }
        .nav-left img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-left: 15px;
        }
        .brand-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .nav-center {
            flex: 1;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .nav-right {
            flex: 1;
            justify-content: flex-end;
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        .nav-right li {
            margin-left: 25px;
        }
        .nav-right li a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        .nav-right li a:hover {
            color: #007bff;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-section nav-left">
        <img src="LOGO.jpg.jpeg" alt="Logo">
        <span class="brand-name">DARK TRADER</span>
    </div>
    
    <div class="nav-section nav-center">
        Master of forex trading
    </div>

    <ul class="nav-section nav-right">
        
        <li><a href="afzalkhamar123@gmail.com">Contact Us</a></li>
        <li><a href="#">Signals</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Home</a></li>
    </ul>
</nav>

</body>
</html>
